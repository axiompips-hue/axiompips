appId: com.axiompips.desktop
productName: AxiomPips
copyright: "Copyright © 2025 AxiomPips"

# Override the main entry point for this specific build.
# package.json "main" points to main.js (the installer entry), but the
# desktop wrapper entry point is electron/main.js. extraMetadata patches
# package.json inside the asar at build time without changing the file on disk.
extraMetadata:
  main: electron/main.js

directories:
  buildResources: electron/assets
  output: dist-app

files:
  - "electron/**"
  - "!electron/assets/ICON_INSTRUCTIONS.md"

win:
  target:
    # 'dir' builds to dist-app/win-unpacked/ (unpacked folder, not a standalone .exe).
    # The custom installer (installer-builder.yml) then bundles this folder via
    # extraResources and copies AxiomPips.exe to the user's chosen install directory.
    - target: dir
  # electron-builder auto-converts icon.png to .ico on Windows builds.
  # Replace icon.png (and optionally icon.ico) with real artwork before release.
  # See electron/assets/ICON_INSTRUCTIONS.md for instructions.
  icon: electron/assets/icon.png
  artifactName: "AxiomPips.exe"
  requestedExecutionLevel: asInvoker
  signingHashAlgorithms: null
  sign: null

publish: null
