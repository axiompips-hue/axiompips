appId: com.axiompips.desktop
productName: AxiomPips
copyright: "Copyright © 2025 AxiomPips"

# Override the package.json main field for this build.
# package.json points to main.js (old installer entry) — the actual app is electron/main.js.
extraMetadata:
  main: electron/main.js

directories:
  buildResources: electron/assets
  output: dist-installer

files:
  - "electron/**"
  - "!electron/assets/ICON_INSTRUCTIONS.md"

win:
  target:
    - target: nsis
  icon: electron/assets/icon.png
  requestedExecutionLevel: asInvoker
  signingHashAlgorithms: null
  sign: null

nsis:
  oneClick: false                           # shows install wizard, not a silent install
  perMachine: false                         # installs per-user — no admin rights needed
  allowToChangeInstallationDirectory: true  # user can pick install folder
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AxiomPips
  deleteAppDataOnUninstall: true            # clean uninstall via Windows Settings

publish: null
