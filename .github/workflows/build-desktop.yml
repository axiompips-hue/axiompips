name: Build Desktop App

on:
  push:
    branches:
      - master
    paths:
      - "electron-installer/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: electron-installer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate placeholder icons (if real icons not present)
        run: node scripts/generate-placeholder-icon.js

      - name: Build installer
        run: npm run build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomPipsSetup
          path: electron-installer/dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: electron-installer/dist-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
